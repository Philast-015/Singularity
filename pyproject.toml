[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "singularity-twinx"
version = "0.1.2"
description = "A Music + video player all in a single page with web and desktop app view."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.31.0",
    "rich>=15.0.0",
    "yt-dlp>=2026.6.0",
]

[project.scripts]
singularity = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["Music-static/*", "Video-static/*", "ui/dist/**/*"]
