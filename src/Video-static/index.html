<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Video Player</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div
            id="data"
            data-stream-url=""
            data-title=""
            data-channel=""
            data-api-base="http://127.0.0.1:5000"
            data-video-id=""
            data-description=""
            data-views=""
            data-thumbnail=""
            data-best-audio-url=""
        ></div>
        <div id="app">
            <div id="player-col">
                <div id="player-wrap">
                    <audio id="audio-player" preload="auto"></audio>
                    <video id="player" playsinline></video>
                    <div id="player-overlay">
                        <div id="loading-spinner">
                            <div class="spinner"></div>
                        </div>
                    </div>
                    <div id="controls">
                        <div id="progress-wrap">
                            <div id="progress-buffer"></div>
                            <div id="progress-bar"></div>
                            <div id="progress-thumb"></div>
                        </div>
                        <div id="controls-row">
                            <div id="ctrl-left">
                                <button
                                    id="play-btn"
                                    title="Play/Pause (Space)"
                                >
                                    <i class="bi bi-play-fill"></i>
                                </button>
                                <div id="volume-group">
                                    <button id="mute-btn" title="Mute (M)">
                                        <i class="bi bi-volume-up-fill"></i>
                                    </button>
                                    <input
                                        type="range"
                                        id="volume"
                                        min="0"
                                        max="1"
                                        step="0.05"
                                        value="1"
                                    />
                                </div>
                                <span id="time-display"
                                    ><span id="current-time">0:00</span> /
                                    <span id="duration">0:00</span></span
                                >
                            </div>
                            <div id="ctrl-right">
                                <button id="info-btn" title="Video info">
                                    <i class="bi bi-chevron-down"></i>
                                </button>
                                <select id="quality-select" title="Quality">
                                    <option value="">Auto</option>
                                </select>
                                <button id="pip-btn" title="Miniplayer">
                                    <i class="bi bi-pip"></i>
                                </button>
                                <button
                                    id="fullscreen-btn"
                                    title="Fullscreen (F)"
                                >
                                    <i class="bi bi-fullscreen"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="info-drawer">
                    <div id="drawer-handle"><div id="drawer-bar"></div></div>
                    <div id="drawer-inner">
                        <h1 id="title"></h1>
                        <p id="channel"></p>
                        <div id="meta-row">
                            <span id="views-display"></span>
                            <div id="action-btns">
                                <button
                                    id="open-yt-btn"
                                    title="Open in YouTube"
                                >
                                    <i class="bi bi-box-arrow-up-right"></i>
                                </button>
                            </div>
                        </div>
                        <div id="desc-section">
                            <div id="desc-header">
                                <span>Description</span>
                                <button id="desc-toggle">
                                    <i class="bi bi-chevron-down"></i>
                                </button>
                            </div>
                            <div id="desc-content"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
