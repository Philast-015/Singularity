<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>
            Playing: At Peace (Official Video) Karan Aujla | Latest Punjabi
            Songs 2025
        </title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div
            id="data"
            data-video-id="jVVwYXV22zg"
            data-title="At Peace (Official Video) Karan Aujla | Latest Punjabi Songs 2025"
            data-channel="Rehaan Records"
            data-thumbnail="https://i.ytimg.com/vi/jVVwYXV22zg/maxresdefault.jpg"
            data-api-base="http://127.0.0.1:5000"
        ></div>
        <div id="app">
            <div id="left-col">
                <div id="thumb-wrap">
                    <img
                        id="art"
                        src="https://i.ytimg.com/vi/jVVwYXV22zg/maxresdefault.jpg"
                        alt="album art"
                    />
                </div>
                <div id="right-btns">
                    <button id="mute-btn">
                        <i class="bi bi-volume-up-fill"></i>
                    </button>
                    <button id="repeat-btn">
                        <i class="bi bi-repeat-1"></i>
                    </button>
                </div>
                <audio id="player"></audio>
                <button id="play-btn"><i class="bi bi-play-fill"></i></button>
                <h1 id="title"></h1>
                <p id="channel"></p>
                <div id="progress-bar">
                    <span id="current-time">0:00</span>
                    <input
                        type="range"
                        id="seek"
                        value="0"
                        min="0"
                        max="100"
                        step="0.1"
                    />
                    <span id="duration">0:00</span>
                </div>
            </div>
            <div id="right-col">
                <div id="suggestions-section">
                    <h2>Up next</h2>
                    <ul id="suggestions-list"></ul>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
